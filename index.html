<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>京都 9/12–13 旅程カレンダー</title>
<style>
:root{--bg:#f6f7f8;--card:#fff;--text:#17191d;--muted:#68707c;--line:#e4e7eb;--accent:#1f6f54;--sel:#dff2e8;--bad:#b42318;--badbg:#fff0ee;--hour:72px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:980px;margin:auto;padding:16px 12px 110px}.header{position:sticky;top:0;z-index:50;background:rgba(246,247,248,.94);backdrop-filter:blur(12px);padding:8px 0 14px}h1{margin:0 0 5px;font-size:23px}.sub{font-size:13px;color:var(--muted);line-height:1.55}.day{margin-top:20px}.dayhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.dayhead h2{margin:0;font-size:19px}.badge{font-size:12px;background:#eef1f4;padding:6px 9px;border-radius:999px;color:#4c5561}.calendar{display:grid;grid-template-columns:58px 1fr;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 5px 18px rgba(0,0,0,.06)}.times{position:relative;background:#fafbfc;border-right:1px solid var(--line)}.time-label{position:absolute;right:8px;transform:translateY(-50%);font-size:11px;color:#7b838e}.grid{position:relative;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hour) - 1px),#eceff2 calc(var(--hour) - 1px),#eceff2 var(--hour))}.half-line{position:absolute;left:0;right:0;border-top:1px dashed #f0f1f3}.event{position:absolute;border:1px solid #cfd8d3;background:#f7fbf9;border-radius:12px;padding:7px 8px;cursor:pointer;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-gutter:stable;touch-action:pan-y}.event.selected{background:var(--sel);border-color:var(--accent)}.event.conflict{background:var(--badbg);border-color:#efb4ad}.title{font-weight:800;font-size:12px;line-height:1.25;word-break:break-word}.time{font-size:10px;color:#5e6672;margin-top:2px}.meta{font-size:9px;color:#6f7884;margin-top:4px;line-height:1.3}.card-url{display:inline-block;margin-top:5px;padding:3px 6px;border-radius:999px;background:#fff;border:1px solid #c9d8d0;color:var(--accent);font-size:9px;font-weight:800;text-decoration:none;line-height:1.4}.event.selected .card-url{background:rgba(255,255,255,.72)}.notice{display:none;margin:10px 0;padding:10px 12px;border:1px solid #efb4ad;background:var(--badbg);color:#8d2119;border-radius:12px;font-size:12px}.notice.show{display:block}.legend{margin:8px 2px 0;font-size:11px;color:var(--muted)}.details{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px}.details h3{font-size:14px;margin:0 0 8px}.selected-list{display:grid;gap:7px}.selected-item{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;background:#f8faf9;border-radius:10px;font-size:12px}.summary{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}.summary-inner{max-width:980px;margin:auto;display:flex;gap:10px;align-items:center}.summary-text{flex:1;min-width:0;font-size:12px;color:#4d5560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}button{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:800}@media(max-width:600px){:root{--hour:68px}.wrap{padding-left:8px;padding-right:8px}.calendar{grid-template-columns:50px 1fr}.event{padding:5px 6px}.title{font-size:10px}.meta{font-size:8px}.card-url{font-size:8px;padding:2px 5px}}
</style>
</head>
<body><div class="wrap"><div class="header"><h1>京都 9/12–13 旅程カレンダー</h1><div class="sub">2026/9/12（土）・9/13（日）に開催・営業する根拠が確認できた候補を中心に掲載。予約制はカード内に「要予約確認」と明記。カード内は縦スクロールできます。</div></div><div id="app"></div><div class="details"><h3>選択中の旅程</h3><div id="selected" class="selected-list"></div></div></div><div class="summary"><div class="summary-inner"><div id="summary" class="summary-text"></div><button id="copy">旅程をコピー</button></div></div>
<script>
const DAYS=[
{date:'2026-09-12',label:'9/12（土）',badge:'昼集合・遊ぶ京都',start:11,end:22,events:[
['lunch','12:00','13:00','京都駅周辺で集合・昼食','集合しやすさ優先',1,'https://www.google.com/maps/search/?api=1&query=京都駅+ランチ','地図'],
['museum','13:30','15:00','京都伝統産業ミュージアム','10:00–18:00。9/12は休館日ではなく、9/12–13は京仏壇・京仏具技術コンクール展も開催。滞在時間は旅程上の例。',0,'https://kmtc.jp/','公式'],
['kwasan','14:00','16:00','京都大学 花山天文台・土曜公開','9/12は公式公開日。自由見学/4D宇宙シアター。実際の開始時刻は予約ページで確認。要予約確認。',0,'https://www.kwasan.kyoto-u.ac.jp/open/kwasan/donichi.html','公式'],
['whisky','14:00','16:00','ウイスキー・オリジナルボトル製作','9/12限定 14:00–16:00。二条城前。定員8名。要予約確認。',0,'https://shop.romanbeer.com/view/item/000000000589','予約'],
['woodmill','15:00','17:00','WOODMILL BREWERY.KYOTO','9/12はTAP ROOM 11:00–17:00（L.O.16:30）。滞在時間は旅程上の例。',0,'https://woodmill-brewery.kyoto/','公式'],
['beer','17:00','18:30','京都醸造 タップルーム','土日祝営業。5–9月は12:00–19:00（L.O.18:30）。',0,'https://kyotobrewing.com/pages/taproom','公式'],
['dinner','19:00','21:00','発酵・日本酒系で夕食','翌朝に備えて深追いしない。店は後で選択。',1,'https://www.google.com/maps/search/?api=1&query=京都+発酵+日本酒+居酒屋','地図']]},
{date:'2026-09-13',label:'9/13（日）',badge:'禅＋茶農業',start:6,end:19,events:[
['tenryu','07:10','08:30','天龍寺 朝参拝','9/13限定。和尚の案内・雲龍図・曹源池庭園。3,000円、事前予約限定。要予約確認。',0,'https://ja.kyoto.travel/event/single.php?event_id=11994','予約'],
['kennin','07:30','09:00','建仁寺「千光会」','9/13 7:30開始を公式告知。予約不要。法話は中止、坐禅と読経は実施予定。',1,'https://www.kenninji.jp/news/?cat=1','公式'],
['breakfast','09:00','10:00','祇園で朝食','建仁寺後の休憩。',1,'https://www.google.com/maps/search/?api=1&query=祇園+朝食','地図'],
['dmatcha','09:30','13:30','d:matcha Organic Matcha Farm Tour','9:30–13:30。茶畑・碾茶工場・石臼・単一品種抹茶/煎茶・農園ランチ。予約専用、9/13空席は要予約確認。',0,'https://dmatcha.com/products/tea-farm-tour-and-tasting-wazuka-kyoto','予約'],
['move','10:00','11:30','和束へ移動','建仁寺→和束。車移動が組みやすい。',1,'https://www.google.com/maps/dir/?api=1&origin=建仁寺&destination=和束町','経路'],
['obubu','11:00','15:00','京都おぶぶ茶苑 Guided Tea Tour','公式カレンダーで11:00 Guided Tea Tourを運用。9/13は専用シャトル運行日も確認。9/13のツアー空席は要予約確認。',0,'https://obubutea.com/guided-tea-tour/','予約'],
['slow1','11:10','12:25','和束 Green Slow Mobility Tour','3–11月の土日祝に運行。11:10–12:25枠。茶畑景観と茶業解説。空きがあれば当日予約可。',0,'https://wazukanko.com/tour-guide-en/','公式'],
['pick','12:00','13:00','和束家・季節の茶摘み','茶摘みシーズン内。9/13の個別枠は要予約確認。',0,'https://experiences.wazukahouse.com/tea-picking/','予約'],
['ishidera','12:00','13:15','石寺の茶畑フィールド観察','茶畑景観を外から観察。私有茶園へ無断で入らない前提。',0,'https://www.google.com/maps/search/?api=1&query=石寺の茶畑+和束町','地図'],
['slow2','13:30','14:45','和束 Green Slow Mobility Tour','3–11月の土日祝に運行。13:30–14:45枠。空きがあれば当日予約可。',0,'https://wazukanko.com/tour-guide-en/','公式'],
['cafe','14:45','15:45','和束茶カフェ・農家茶比較','通常10:00–17:00、不定休。農家茶を比較する休憩枠。9/13営業は直前再確認推奨。',0,'https://wazukacha-cafe.com/pages/wazukacha-cafe','公式'],
['slow3','15:00','16:10','和束 Green Slow Mobility Tour','3–11月の土日祝に運行。15:00–16:10枠。空きがあれば当日予約可。',0,'https://wazukanko.com/tour-guide-en/','公式'],
['return','16:30','18:00','京都方面へ戻る','帰宅先に合わせて調整。',0,'https://www.google.com/maps/dir/?api=1&origin=和束町&destination=京都駅','経路']]}
];
const M=t=>{const[h,m]=t.split(':').map(Number);return h*60+m},OV=(a,b)=>M(a.s)<M(b.e)&&M(b.s)<M(a.e);const chosen=new Set();
function render(){const app=document.getElementById('app');app.innerHTML='';DAYS.forEach(d=>{const sec=document.createElement('section');sec.className='day';sec.innerHTML=`<div class="dayhead"><h2>${d.label}</h2><span class="badge">${d.badge}</span></div><div class="calendar"><div class="times"></div><div class="grid"></div></div><div class="notice"></div><div class="legend">クリックで選択/解除。重なる予定は同時選択できません。カード内は縦スクロールできます。</div>`;app.appendChild(sec);const times=sec.querySelector('.times'),grid=sec.querySelector('.grid');const hp=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hour'))||72,h=(d.end-d.start)*hp;times.style.height=grid.style.height=h+'px';for(let x=d.start;x<=d.end;x++){let y=(x-d.start)*hp,l=document.createElement('div');l.className='time-label';l.style.top=y+'px';l.textContent=String(x).padStart(2,'0')+':00';times.appendChild(l);if(x<d.end){let q=document.createElement('div');q.className='half-line';q.style.top=(y+hp/2)+'px';grid.appendChild(q)}}const els=[];d.events.forEach(v=>{const o={id:v[0],s:v[1],e:v[2],title:v[3],meta:v[4],def:v[5],url:v[6],urlLabel:v[7]||'URL'};if(o.def)chosen.add(o.id);const el=document.createElement('div');el.className='event'+(chosen.has(o.id)?' selected':'');el.dataset.id=o.id;el.innerHTML=`<div class="title">${o.title}</div><div class="time">${o.s}–${o.e}</div><div class="meta">${o.meta}</div>${o.url?`<a class="card-url" href="${o.url}" target="_blank" rel="noopener noreferrer">${o.urlLabel} ↗</a>`:''}`;el.style.top=((M(o.s)-d.start*60)/60*hp+4)+'px';el.style.height=Math.max((M(o.e)-M(o.s))/60*hp-8,46)+'px';grid.appendChild(el);els.push({el,...o});el.onclick=()=>toggle(sec,d,o,el);const a=el.querySelector('.card-url');if(a)a.onclick=e=>e.stopPropagation()});layout(els)});refresh()}
function layout(arr){const sorted=[...arr].sort((a,b)=>M(a.s)-M(b.s)||M(a.e)-M(b.e));let groups=[],g=[],end=-1;for(const x of sorted){if(!g.length||M(x.s)<end){g.push(x);end=Math.max(end,M(x.e))}else{groups.push(g);g=[x];end=M(x.e)}}if(g.length)groups.push(g);for(const group of groups){let ends=[],as=[];for(const x of group){let c=ends.findIndex(e=>e<=M(x.s));if(c<0){c=ends.length;ends.push(M(x.e))}else ends[c]=M(x.e);as.push([x,c])}const n=ends.length;for(const[x,c]of as){x.el.style.left=`calc(${c/n*100}% + 4px)`;x.el.style.width=`calc(${100/n}% - 8px)`}}}
function toggle(sec,d,o,el){const note=sec.querySelector('.notice');if(chosen.has(o.id)){chosen.delete(o.id);el.classList.remove('selected');note.classList.remove('show');refresh();return}const conflicts=d.events.map(v=>({id:v[0],s:v[1],e:v[2],title:v[3]})).filter(x=>chosen.has(x.id)&&OV(o,x));if(conflicts.length){el.classList.add('conflict');note.textContent='「'+conflicts.map(x=>x.title).join(' / ')+'」と時間が重なります。';note.classList.add('show');setTimeout(()=>el.classList.remove('conflict'),1000);return}chosen.add(o.id);el.classList.add('selected');note.classList.remove('show');refresh()}
function rows(){let r=[];for(const d of DAYS)for(const v of d.events)if(chosen.has(v[0]))r.push({day:d.label.slice(0,4),s:v[1],e:v[2],title:v[3]});return r.sort((a,b)=>a.day.localeCompare(b.day)||M(a.s)-M(b.s))}
function refresh(){const r=rows(),box=document.getElementById('selected');box.innerHTML=r.length?r.map(x=>`<div class="selected-item"><b>${x.day} ${x.s}–${x.e}</b><span>${x.title}</span></div>`).join(''):'<div>まだ予定が選択されていません。</div>';document.getElementById('summary').textContent=r.length?r.map(x=>`${x.day} ${x.s} ${x.title}`).join(' / '):'予定未選択'}
document.getElementById('copy').onclick=async()=>{const t=rows().map(x=>`${x.day} ${x.s}–${x.e} ${x.title}`).join('\n');try{await navigator.clipboard.writeText(t);alert('旅程をコピーしました')}catch(e){prompt('コピーしてください',t)}};render();
</script></body></html>
