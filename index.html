<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>京都 9/12–13 旅程カレンダー</title>
<style>
:root{--bg:#f6f7f8;--card:#fff;--text:#17191d;--muted:#68707c;--line:#e4e7eb;--accent:#1f6f54;--sel:#dff2e8;--bad:#b42318;--badbg:#fff0ee;--hour:72px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:980px;margin:auto;padding:16px 12px 110px}.header{position:sticky;top:0;z-index:50;background:rgba(246,247,248,.94);backdrop-filter:blur(12px);padding:8px 0 14px}h1{margin:0 0 5px;font-size:23px}.sub{font-size:13px;color:var(--muted);line-height:1.55}.day{margin-top:20px}.dayhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.dayhead h2{margin:0;font-size:19px}.badge{font-size:12px;background:#eef1f4;padding:6px 9px;border-radius:999px;color:#4c5561}.calendar{display:grid;grid-template-columns:58px 1fr;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 5px 18px rgba(0,0,0,.06)}.times{position:relative;background:#fafbfc;border-right:1px solid var(--line)}.time-label{position:absolute;right:8px;transform:translateY(-50%);font-size:11px;color:#7b838e}.grid{position:relative;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hour) - 1px),#eceff2 calc(var(--hour) - 1px),#eceff2 var(--hour))}.half-line{position:absolute;left:0;right:0;border-top:1px dashed #f0f1f3}.event{position:absolute;border:1px solid #cfd8d3;background:#f7fbf9;border-radius:12px;padding:7px 8px;cursor:pointer;overflow:hidden}.event.selected{background:var(--sel);border-color:var(--accent)}.event.conflict{background:var(--badbg);border-color:#efb4ad}.title{font-weight:800;font-size:12px;line-height:1.25;word-break:break-word}.time{font-size:10px;color:#5e6672;margin-top:2px}.meta{font-size:9px;color:#6f7884;margin-top:4px;line-height:1.3}.card-url{display:inline-block;margin-top:5px;padding:2px 6px;border-radius:999px;background:#fff;border:1px solid #c9d8d0;color:var(--accent);font-size:9px;font-weight:800;text-decoration:none;line-height:1.4}.event.selected .card-url{background:rgba(255,255,255,.72)}.notice{display:none;margin:10px 0;padding:10px 12px;border:1px solid #efb4ad;background:var(--badbg);color:#8d2119;border-radius:12px;font-size:12px}.notice.show{display:block}.legend{margin:8px 2px 0;font-size:11px;color:var(--muted)}.details{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px}.details h3{font-size:14px;margin:0 0 8px}.selected-list{display:grid;gap:7px}.selected-item{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;background:#f8faf9;border-radius:10px;font-size:12px}.summary{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}.summary-inner{max-width:980px;margin:auto;display:flex;gap:10px;align-items:center}.summary-text{flex:1;min-width:0;font-size:12px;color:#4d5560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}button{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:800}@media(max-width:600px){:root{--hour:68px}.wrap{padding-left:8px;padding-right:8px}.calendar{grid-template-columns:50px 1fr}.event{padding:5px 6px}.title{font-size:10px}.meta{font-size:8px}.card-url{font-size:8px;padding:1px 5px}}
</style>
</head>
<body><div class="wrap"><div class="header"><h1>京都 9/12–13 旅程カレンダー</h1><div class="sub">候補をGoogleカレンダー風に比較。重なる候補は横並びで表示し、同じ時間帯は1件だけ選択できます。各カードの「公式/地図 ↗」から詳細を確認できます。</div></div><div id="app"></div><div class="details"><h3>選択中の旅程</h3><div id="selected" class="selected-list"></div></div></div><div class="summary"><div class="summary-inner"><div id="summary" class="summary-text"></div><button id="copy">旅程をコピー</button></div></div>
<script>
const DAYS=[
{date:'2026-09-12',label:'9/12（土）',badge:'昼集合・遊ぶ京都',start:11,end:23,events:[
['lunch','12:00','13:00','京都駅周辺で集合・昼食','集合しやすさ優先',1,'https://www.google.com/maps/search/?api=1&query=京都駅+ランチ','地図'],
['fushimi','13:30','17:00','伏見・酒蔵フィールドワーク','発酵・酒造を半日で見る',0,'https://www.gekkeikan.co.jp/enjoy/museum/','公式'],
['museum','13:30','15:00','京都伝統産業ミュージアム','工芸をまとめて見る / 時刻仮置き',0,'https://kmtc.jp/','公式'],
['sake','14:00','15:30','日本酒ブレンド体験','農学部適性 ★★★★☆',0,'https://mysakeworld.com/','公式'],
['dye','14:00','16:00','ろうけつ染め・職人体験','京都文化 / 手を動かす',0,'https://www.roketsu.com/ja/home/','公式'],
['waraku','14:30','16:30','京町屋・体験工房 和楽','ものづくり / 枠要確認',0,'https://waraku.kyoto.jp/waraku/','公式'],
['tea','15:00','16:30','市内で茶文化体験','文化としての茶',0,'https://www.google.com/maps/search/?api=1&query=茶道体験+京都','地図'],
['akari','15:00','17:00','あかりデザイン工房','和紙・照明 / 時刻仮置き',0,'https://www.kyoto-akari.com/','公式'],
['beerlab','16:00','17:30','京都ビアラボ','クラフトビール',0,'https://www.google.com/maps/search/?api=1&query=京都ビアラボ','地図'],
['beer','17:00','18:30','京都醸造・クラフトビール','麦・ホップ・酵母',0,'https://kyotobrewing.com/pages/taproom','公式'],
['spring','17:30','19:00','SPRING VALLEY BREWERY 京都','クラフトビール比較',0,'https://www.google.com/maps/search/?api=1&query=SPRING+VALLEY+BREWERY+京都','地図'],
['arashi','18:00','19:30','京都嵐山ブルワリー 三条醸造所','街中ブルワリー',0,'https://www.google.com/maps/search/?api=1&query=京都嵐山ブルワリー+三条醸造所','地図'],
['dinner','19:30','21:00','発酵・日本酒系で夕食','翌朝に備えて深追いしない',1,'https://www.google.com/maps/search/?api=1&query=京都+発酵+日本酒+居酒屋','地図']]},
{date:'2026-09-13',label:'9/13（日）',badge:'禅＋茶農業',start:6,end:19,events:[
['kennin','07:30','09:00','建仁寺「千光会」','坐禅20分×2＋読経 / 予約不要 / 確度高',1,'https://www.kenninji.jp/experience/','公式'],
['breakfast','09:00','10:00','祇園で朝食','建仁寺後に一息',1,'https://www.google.com/maps/search/?api=1&query=祇園+朝食','地図'],
['dmatcha','09:30','13:30','d:matcha ガチ農学コース','茶畑・碾茶工場・石臼・単一品種比較',0,'https://dmatcha.com/collections/online-tea-tasting/products/tea-farm-tour-and-tasting-wazuka-kyoto','予約'],
['move','10:00','11:30','和束へ移動','車移動が組みやすい',1,'https://www.google.com/maps/search/?api=1&query=京都府+和束町','地図'],
['obubu','12:00','16:00','京都おぶぶ茶苑 Tea Tour','茶畑→栽培→製茶→テイスティング',0,'https://obubutea.com/guided-tea-tour/','予約'],
['pick','12:00','13:00','和束家・季節の茶摘み','約30〜40分 / 要予約 / ¥3,630〜',0,'https://experiences.wazukahouse.com/tea-picking/','予約'],
['field','12:00','15:30','自由フィールドワーク','茶畑＋生産者系ショップ＋飲み比べ',0,'https://www.google.com/maps/search/?api=1&query=和束町+茶畑','地図'],
['ishidera','12:00','13:15','石寺の茶畑フィールド観察','景観＋圃場観察',0,'https://www.google.com/maps/search/?api=1&query=石寺の茶畑+和束町','地図'],
['guide','12:30','14:00','和束プライベートガイド','産地全体を短時間で理解',0,'https://wazukanko.com/tour/','公式'],
['well','12:30','14:30','THE WELL・有機茶/産地維持','有機栽培・小規模農家・流通',0,'https://thewell-kyoto.com/','公式'],
['soba','13:15','15:00','和束家・茶蕎麦づくり','食×農 / 時刻仮置き',0,'https://experiences.wazukahouse.com/','公式'],
['cafe','14:00','15:00','和束茶カフェ・農家茶比較','複数農家の商品を比較',0,'https://wazukacha-cafe.com/pages/wazukacha-cafe','公式'],
['single','15:00','16:00','シングルオリジン茶・比較会','品種・畑・製法差を見る',0,'https://wazukacha-cafe.com/pages/wazukacha-cafe','公式'],
['return','16:30','18:00','京都方面へ戻る','帰宅先に合わせて調整',0,'https://www.google.com/maps/dir/?api=1&origin=和束町&destination=京都駅','経路']]}
];
const M=t=>{const[h,m]=t.split(':').map(Number);return h*60+m},OV=(a,b)=>M(a.s)<M(b.e)&&M(b.s)<M(a.e);const chosen=new Set();
function render(){const app=document.getElementById('app');app.innerHTML='';DAYS.forEach(d=>{const sec=document.createElement('section');sec.className='day';sec.innerHTML=`<div class="dayhead"><h2>${d.label}</h2><span class="badge">${d.badge}</span></div><div class="calendar"><div class="times"></div><div class="grid"></div></div><div class="notice"></div><div class="legend">クリックで選択/解除。重なる予定は同時選択できません。</div>`;app.appendChild(sec);const times=sec.querySelector('.times'),grid=sec.querySelector('.grid');const hp=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hour'))||72,h=(d.end-d.start)*hp;times.style.height=grid.style.height=h+'px';for(let x=d.start;x<=d.end;x++){let y=(x-d.start)*hp,l=document.createElement('div');l.className='time-label';l.style.top=y+'px';l.textContent=String(x).padStart(2,'0')+':00';times.appendChild(l);if(x<d.end){let q=document.createElement('div');q.className='half-line';q.style.top=(y+hp/2)+'px';grid.appendChild(q)}}const els=[];d.events.forEach(v=>{const o={id:v[0],s:v[1],e:v[2],title:v[3],meta:v[4],def:v[5],url:v[6],urlLabel:v[7]||'URL'};if(o.def)chosen.add(o.id);const el=document.createElement('div');el.className='event'+(chosen.has(o.id)?' selected':'');el.dataset.id=o.id;el.innerHTML=`<div class="title">${o.title}</div><div class="time">${o.s}–${o.e}</div><div class="meta">${o.meta}</div>${o.url?`<a class="card-url" href="${o.url}" target="_blank" rel="noopener noreferrer">${o.urlLabel} ↗</a>`:''}`;el.style.top=((M(o.s)-d.start*60)/60*hp+4)+'px';el.style.height=Math.max((M(o.e)-M(o.s))/60*hp-8,46)+'px';grid.appendChild(el);els.push({el,...o});el.onclick=()=>toggle(sec,d,o,el);const a=el.querySelector('.card-url');if(a)a.onclick=e=>e.stopPropagation()});layout(els)});refresh()}
function layout(arr){const sorted=[...arr].sort((a,b)=>M(a.s)-M(b.s)||M(a.e)-M(b.e));let groups=[],g=[],end=-1;for(const x of sorted){if(!g.length||M(x.s)<end){g.push(x);end=Math.max(end,M(x.e))}else{groups.push(g);g=[x];end=M(x.e)}}if(g.length)groups.push(g);for(const group of groups){let ends=[],as=[];for(const x of group){let c=ends.findIndex(e=>e<=M(x.s));if(c<0){c=ends.length;ends.push(M(x.e))}else ends[c]=M(x.e);as.push([x,c])}const n=ends.length;for(const[x,c]of as){x.el.style.left=`calc(${c/n*100}% + 4px)`;x.el.style.width=`calc(${100/n}% - 8px)`}}}
function toggle(sec,d,o,el){const note=sec.querySelector('.notice');if(chosen.has(o.id)){chosen.delete(o.id);el.classList.remove('selected');note.classList.remove('show');refresh();return}const conflicts=d.events.map(v=>({id:v[0],s:v[1],e:v[2],title:v[3]})).filter(x=>chosen.has(x.id)&&OV(o,x));if(conflicts.length){el.classList.add('conflict');note.textContent='「'+conflicts.map(x=>x.title).join(' / ')+'」と時間が重なります。';note.classList.add('show');setTimeout(()=>el.classList.remove('conflict'),1000);return}chosen.add(o.id);el.classList.add('selected');note.classList.remove('show');refresh()}
function rows(){let r=[];for(const d of DAYS)for(const v of d.events)if(chosen.has(v[0]))r.push({day:d.label.slice(0,4),s:v[1],e:v[2],title:v[3]});return r.sort((a,b)=>a.day.localeCompare(b.day)||M(a.s)-M(b.s))}
function refresh(){const r=rows(),box=document.getElementById('selected');box.innerHTML=r.length?r.map(x=>`<div class="selected-item"><b>${x.day} ${x.s}–${x.e}</b><span>${x.title}</span></div>`).join(''):'<div>まだ予定が選択されていません。</div>';document.getElementById('summary').textContent=r.length?r.map(x=>`${x.day} ${x.s} ${x.title}`).join(' / '):'予定未選択'}
document.getElementById('copy').onclick=async()=>{const t=rows().map(x=>`${x.day} ${x.s}–${x.e} ${x.title}`).join('\n');try{await navigator.clipboard.writeText(t);alert('旅程をコピーしました')}catch(e){prompt('コピーしてください',t)}};render();
</script></body></html>
