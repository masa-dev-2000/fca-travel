<html lang="ja">
<head>

<style>
:root{--bg:#f6f7f8;--card:#fff;--text:#17191d;--muted:#68707c;--line:#e4e7eb;--accent:#1f6f54;--sel:#dff2e8;--bad:#b42318;--badbg:#fff0ee;--hour:72px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:1050px;margin:auto;padding:16px 12px 120px}.header{position:sticky;top:0;z-index:50;background:rgba(246,247,248,.95);backdrop-filter:blur(12px);padding:8px 0 14px}
h1{font-size:23px;margin:0 0 5px}.sub{font-size:13px;color:var(--muted);line-height:1.55}.day{margin-top:20px}.dayhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.dayhead h2{font-size:19px;margin:0}.badge,.chip{font-size:11px;padding:5px 8px;border-radius:999px;background:#eef1f4;color:#4d5561;display:inline-block}.chip.ok{background:#e8f5ee;color:#116443}.chip.warn{background:#fff5dd;color:#8a5a00}
.calendar{display:grid;grid-template-columns:58px 1fr;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 5px 18px rgba(0,0,0,.06)}
.times{position:relative;background:#fafbfc;border-right:1px solid var(--line)}.time-label{position:absolute;right:8px;transform:translateY(-50%);font-size:11px;color:#7b838e}
.grid{position:relative;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hour) - 1px),#eceff2 calc(var(--hour) - 1px),#eceff2 var(--hour))}
.half-line{position:absolute;left:0;right:0;border-top:1px dashed #f0f1f3}
.event{position:absolute;border:1px solid #cfd8d3;background:#f7fbf9;border-radius:12px;padding:7px 8px;cursor:pointer;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-gutter:stable;touch-action:pan-y}
.event.selected{background:var(--sel);border-color:var(--accent)}.event.conflict{background:var(--badbg);border-color:#efb4ad}.title{font-weight:800;font-size:12px;line-height:1.25;word-break:break-word}.time{font-size:10px;color:#5e6672;margin-top:2px}.meta{font-size:9px;color:#6f7884;margin-top:4px;line-height:1.35}.card-url{display:inline-block;margin-top:5px;padding:3px 6px;border-radius:999px;background:#fff;border:1px solid #c9d8d0;color:var(--accent);font-size:9px;font-weight:800;text-decoration:none}
.notice{display:none;margin:10px 0;padding:10px 12px;border:1px solid #efb4ad;background:var(--badbg);color:#8d2119;border-radius:12px;font-size:12px}.notice.show{display:block}.legend{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
.hotel-section{margin:28px 0 10px}.hotel-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:10px}.hotel-head h2{font-size:19px;margin:0}.hotel-note{font-size:11px;color:var(--muted);text-align:right;max-width:520px;line-height:1.5}
.hotel-strip{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.hotel-card{flex:0 0 285px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 5px 18px rgba(0,0,0,.05);scroll-snap-align:start;cursor:pointer}
.hotel-photo{height:150px;position:relative;background:linear-gradient(135deg,#dfe8e3,#f5efe4);display:flex;align-items:center;justify-content:center;font-size:46px}
.hotel-photo small{position:absolute;right:8px;bottom:7px;background:rgba(255,255,255,.88);padding:3px 6px;border-radius:999px;font-size:9px;color:#555}
.hotel-body{padding:11px}.hotel-name{font-weight:800;font-size:14px;line-height:1.3}.hotel-price{font-weight:850;color:var(--accent);font-size:15px;margin-top:5px}.hotel-sub{font-size:11px;color:var(--muted);line-height:1.45;margin-top:4px}.hotel-status{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap}
.criteria{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0;font-size:12px;line-height:1.6}.criteria b{color:var(--accent)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.48);display:none;align-items:flex-end;justify-content:center;z-index:100;padding:16px}.modal-backdrop.show{display:flex}.modal{width:min(680px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:20px;padding:16px}.modal-top{display:flex;justify-content:space-between;gap:10px}.modal h3{margin:0;font-size:20px}.modal-grid{display:grid;grid-template-columns:125px 1fr;gap:8px 12px;font-size:13px;line-height:1.5;margin-top:14px}.modal-label{font-weight:800;color:#555}.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.modal-actions a{background:var(--accent);color:#fff;text-decoration:none;padding:9px 12px;border-radius:10px;font-size:12px;font-weight:800}.modal-actions a.secondary{background:#eef4f1;color:var(--accent)}
.details{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px}.details h3{font-size:14px;margin:0 0 8px}.selected-list{display:grid;gap:7px}.selected-item{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;background:#f8faf9;border-radius:10px;font-size:12px}.travel-warn{margin-top:10px;padding:10px 12px;border-radius:12px;background:#fff5dd;color:#795100;font-size:12px;line-height:1.55}.travel-ok{margin-top:10px;padding:10px 12px;border-radius:12px;background:#eaf5ef;color:#175f45;font-size:12px;line-height:1.55}
.summary{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}.summary-inner{max-width:1050px;margin:auto;display:flex;gap:10px;align-items:center}.summary-text{flex:1;min-width:0;font-size:12px;color:#4d5560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}button{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:800}
@media(max-width:600px){:root{--hour:68px}.wrap{padding-left:8px;padding-right:8px}.calendar{grid-template-columns:50px 1fr}.event{padding:5px 6px}.title{font-size:10px}.meta{font-size:8px}.card-url{font-size:8px;padding:2px 5px}.hotel-card{flex-basis:235px}.hotel-photo{height:130px}.hotel-note{max-width:170px}.modal-grid{grid-template-columns:92px 1fr;font-size:12px}}
</style>

<body>
<div class="wrap">
<div class="header"><h1>京都 9/12–13 旅程カレンダー</h1><div class="sub">移動時間を概算して、時間が足りない組み合わせは警告。宿は <b>7名・2室以上・1人1万円以内（総額7万円以内）</b> を条件に再整理。</div></div>
<div id="app"></div>
<div class="details"><h3>選択中の旅程</h3><div id="selected" class="selected-list"></div><div id="travelCheck"></div></div>
</div>
<div class="summary"><div class="summary-inner"><div id="summary" class="summary-text"></div><button id="copy">旅程をコピー</button></div></div>

<script>
const DAYS=[
{date:'2026-09-12',label:'9/12（土）',badge:'昼集合・遊ぶ京都',start:11,end:22,events:[
['lunch','12:00','13:00','京都駅周辺で集合・昼食','集合しやすさ優先',1,'station','https://www.google.com/maps/search/?api=1&query=京都駅+ランチ','地図'],
['museum','13:30','15:00','京都伝統産業ミュージアム','10:00–18:00。滞在時間は旅程上の例。',0,'higashiyama','https://kmtc.jp/','公式'],
['kwasan','14:00','16:00','京都大学 花山天文台・土曜公開','9/12公式公開日。要予約確認。',0,'higashiyama','https://www.kwasan.kyoto-u.ac.jp/open/kwasan/donichi.html','公式'],
['whisky','14:00','16:00','ウイスキー・オリジナルボトル製作','9/12限定 14:00–16:00。要予約確認。',0,'downtown','https://shop.romanbeer.com/view/item/000000000589','予約'],
['woodmill','15:00','17:00','WOODMILL BREWERY.KYOTO','9/12営業。滞在時間は旅程上の例。',0,'west','https://woodmill-brewery.kyoto/','公式'],
['beer','17:00','18:30','京都醸造 タップルーム','土日祝営業。5–9月 12:00–19:00。',0,'south','https://kyotobrewing.com/pages/taproom','公式'],
['dinner','19:00','21:00','発酵・日本酒系で夕食','翌朝に備えて深追いしない。',1,'downtown','https://www.google.com/maps/search/?api=1&query=京都+発酵+日本酒+居酒屋','地図']
]},
{date:'2026-09-13',label:'9/13（日）',badge:'禅＋茶農業',start:6,end:19,events:[
['tenryu','07:10','08:30','天龍寺 朝参拝','9/13限定。3,000円、事前予約限定。',0,'west','https://ja.kyoto.travel/event/single.php?event_id=11994','予約'],
['kennin','07:30','09:00','建仁寺「千光会」','9/13 7:30開始。予約不要。坐禅＋読経。',1,'higashiyama','https://www.kenninji.jp/news/?cat=1','公式'],
['breakfast','09:00','10:00','祇園で朝食','建仁寺後の休憩。',1,'higashiyama','https://www.google.com/maps/search/?api=1&query=祇園+朝食','地図'],
['dmatcha','09:30','13:30','d:matcha Organic Matcha Farm Tour','9:30–13:30。9/13空席は要確認。',0,'wazuka','https://dmatcha.com/products/tea-farm-tour-and-tasting-wazuka-kyoto','予約'],
['move','10:00','11:30','和束へ移動','建仁寺→和束の移動枠。',1,'wazuka','https://www.google.com/maps/dir/?api=1&origin=建仁寺&destination=和束町','経路'],
['obubu','11:00','15:00','京都おぶぶ茶苑 Guided Tea Tour','11:00 Guided Tea Tour。9/13空席は要確認。',0,'wazuka','https://obubutea.com/guided-tea-tour/','予約'],
['slow1','11:10','12:25','和束 Green Slow Mobility Tour','3–11月の土日祝。11:10枠。',0,'wazuka','https://wazukanko.com/tour-guide-en/','公式'],
['pick','12:00','13:00','和束家・季節の茶摘み','茶摘みシーズン内。9/13枠は要確認。',0,'wazuka','https://experiences.wazukahouse.com/tea-picking/','予約'],
['ishidera','12:00','13:15','石寺の茶畑フィールド観察','茶畑景観を外から観察。',0,'wazuka','https://www.google.com/maps/search/?api=1&query=石寺の茶畑+和束町','地図'],
['slow2','13:30','14:45','和束 Green Slow Mobility Tour','13:30枠。',0,'wazuka','https://wazukanko.com/tour-guide-en/','公式'],
['cafe','14:45','15:45','和束茶カフェ・農家茶比較','農家茶を比較する休憩枠。',0,'wazuka','https://wazukacha-cafe.com/pages/wazukacha-cafe','公式'],
['slow3','15:00','16:10','和束 Green Slow Mobility Tour','15:00枠。',0,'wazuka','https://wazukanko.com/tour-guide-en/','公式'],
['return','16:30','18:00','京都方面へ戻る','帰宅先に合わせて調整。',0,'station','https://www.google.com/maps/dir/?api=1&origin=和束町&destination=京都駅','経路']
]}
];

const HOTELS=[
{
name:'京乃宿 清水五条 呉竹荘',icon:'🏨',status:'最有力',price:'7,000円/人〜 → 7名なら約49,000円〜',rooms:'2室以上。和洋室は定員2〜4名。7名なら3名＋4名の2室構成が可能な客室タイプあり。',availability:'じゃらんの9/12検索で「お部屋お任せ・和洋室 素泊り 7,000円/人、あと2部屋」を確認。7名をその2室に割当可能かは予約画面で最終確認。',area:'東山・清水五条',kenninji:'建仁寺まで約0.7〜1km圏。徒歩約10〜15分目安。翌朝7:30にかなり強い。',amenities:'Wi‑Fi、浴場、コインランドリー、コンビニ徒歩3分。清水五条駅徒歩4〜5分。',budget:'総額7万円以内に収まる可能性が高い',confidence:'高（9/12価格＋残2室確認）',official:'https://kyoto.hotelkuretakeso.com/',book:'https://www.jalan.net/260000/LRG_262300/0912/?lpKbn=1',map:'https://www.google.com/maps/search/?api=1&query=京乃宿+清水五条+呉竹荘'
},
{
name:'Rinn Gion Kenninji',icon:'🛏️',status:'予算内見込み',price:'9/12 最安 18,210円/2名1室〜',rooms:'Japanese Triple Roomは定員3名。7名なら 3名＋2名＋2名の3室構成。',availability:'9/12の料金表示を確認。3室同時空室は公開情報だけでは未確定。',area:'祇園・建仁寺すぐ',kenninji:'建仁寺至近。徒歩数分クラスで、朝7:30坐禅には最強。',amenities:'Wi‑Fi、バスタブ、冷蔵庫、セーフティボックス。トリプルはベッド2＋布団1。',budget:'3室を最安単価で仮置きすると約54,630円〜。部屋タイプ差額込みで7万円以内か要最終確認。',confidence:'中（価格と定員確認／3室在庫未確認）',official:'https://rinn-kyomachi.com/',book:'https://www.tour.ne.jp/j_hotel/46130/',map:'https://www.google.com/maps/search/?api=1&query=Rinn+Gion+Kenninji'
},
{
name:'3BR Ensuite Rooms | Riverside View | Near Gion',icon:'🏠',status:'貸切候補',price:'近接日価格 AU$534/1棟（税・手数料込の表示例）',rooms:'7名・3ベッドルーム・3バス。1棟貸切なので「2部屋以上」の条件を満たす。',availability:'施設は7名対応。9/12→9/13・7名の正確な価格と空室は予約画面で要確認。',area:'宮川町〜祇園',kenninji:'Vrbo掲載では建仁寺徒歩10分以内。翌朝の坐禅に強い。',amenities:'キッチン、Wi‑Fi、洗濯機、乾燥機、冷蔵庫。',budget:'近接日価格は7万円圏内の可能性あり。ただし7名料金は変動するため未確定。',confidence:'中（定員・立地確認／当日価格未確定）',official:'https://www.airbnb.com/rooms/904551359012182156',book:'https://www.vrbo.com/en-au/holiday-rental/p20249624',map:'https://www.google.com/maps/search/?api=1&query=Miyagawasuji+Kyoto+Gion'
}
];

const M=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const OV=(a,b)=>M(a.s)<M(b.e)&&M(b.s)<M(a.e);
const chosen=new Set();
const TRANSFER={
'station|higashiyama':25,'higashiyama|station':25,
'station|downtown':15,'downtown|station':15,
'station|west':30,'west|station':30,
'station|south':20,'south|station':20,
'higashiyama|downtown':15,'downtown|higashiyama':15,
'higashiyama|west':35,'west|higashiyama':35,
'higashiyama|south':25,'south|higashiyama':25,
'downtown|west':25,'west|downtown':25,
'downtown|south':20,'south|downtown':20,
'west|south':30,'south|west':30,
'higashiyama|wazuka':80,'wazuka|higashiyama':80,
'downtown|wazuka':90,'wazuka|downtown':90,
'station|wazuka':85,'wazuka|station':85,
'west|wazuka':105,'wazuka|west':105,
'south|wazuka':80,'wazuka|south':80
};
function transfer(a,b){if(a===b)return 8; return TRANSFER[a+'|'+b]||20}

function render(){
 const app=document.getElementById('app'); app.innerHTML='';
 DAYS.forEach((d,di)=>{
  const sec=document.createElement('section');sec.className='day';
  sec.innerHTML=`<div class="dayhead"><h2>${d.label}</h2><span class="badge">${d.badge}</span></div><div class="calendar"><div class="times"></div><div class="grid"></div></div><div class="notice"></div><div class="legend">クリックで選択/解除。重複時間は同時選択不可。移動時間は市内15〜35分、京都市内↔和束80〜105分を概算バッファとしてチェック。</div>`;
  app.appendChild(sec);
  const times=sec.querySelector('.times'),grid=sec.querySelector('.grid'),hp=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hour'))||72,h=(d.end-d.start)*hp;
  times.style.height=grid.style.height=h+'px';
  for(let x=d.start;x<=d.end;x++){let y=(x-d.start)*hp,l=document.createElement('div');l.className='time-label';l.style.top=y+'px';l.textContent=String(x).padStart(2,'0')+':00';times.appendChild(l);if(x<d.end){let q=document.createElement('div');q.className='half-line';q.style.top=(y+hp/2)+'px';grid.appendChild(q)}}
  const els=[];
  d.events.forEach(v=>{
   const o={id:v[0],s:v[1],e:v[2],title:v[3],meta:v[4],def:v[5],zone:v[6],url:v[7],urlLabel:v[8]};
   if(o.def)chosen.add(o.id);
   const el=document.createElement('div');el.className='event'+(chosen.has(o.id)?' selected':'');el.dataset.id=o.id;
   el.innerHTML=`<div class="title">${o.title}</div><div class="time">${o.s}–${o.e}</div><div class="meta">${o.meta}</div><a class="card-url" href="${o.url}" target="_blank" rel="noopener">${o.urlLabel} ↗</a>`;
   el.style.top=((M(o.s)-d.start*60)/60*hp+4)+'px';el.style.height=Math.max((M(o.e)-M(o.s))/60*hp-8,46)+'px';
   grid.appendChild(el);els.push({el,...o});
   el.onclick=()=>toggle(sec,d,o,el);el.querySelector('a').onclick=e=>e.stopPropagation();
  });
  layout(els);
  if(di===0) renderHotels(app);
 });
 refresh();
}
function layout(arr){
 const sorted=[...arr].sort((a,b)=>M(a.s)-M(b.s)||M(a.e)-M(b.e));let groups=[],g=[],end=-1;
 for(const x of sorted){if(!g.length||M(x.s)<end){g.push(x);end=Math.max(end,M(x.e))}else{groups.push(g);g=[x];end=M(x.e)}}if(g.length)groups.push(g);
 for(const group of groups){let ends=[],as=[];for(const x of group){let c=ends.findIndex(e=>e<=M(x.s));if(c<0){c=ends.length;ends.push(M(x.e))}else ends[c]=M(x.e);as.push([x,c])}const n=ends.length;for(const[x,c]of as){x.el.style.left=`calc(${c/n*100}% + 4px)`;x.el.style.width=`calc(${100/n}% - 8px)`}}
}
function toggle(sec,d,o,el){
 const note=sec.querySelector('.notice');
 if(chosen.has(o.id)){chosen.delete(o.id);el.classList.remove('selected');note.classList.remove('show');refresh();return}
 const conflicts=d.events.map(v=>({id:v[0],s:v[1],e:v[2],title:v[3]})).filter(x=>chosen.has(x.id)&&OV(o,x));
 if(conflicts.length){el.classList.add('conflict');note.textContent='「'+conflicts.map(x=>x.title).join(' / ')+'」と時間が重なります。';note.classList.add('show');setTimeout(()=>el.classList.remove('conflict'),1000);return}
 chosen.add(o.id);el.classList.add('selected');note.classList.remove('show');refresh()
}
function renderHotels(app){
 const wrap=document.createElement('section');wrap.className='hotel-section';
 wrap.innerHTML=`<div class="hotel-head"><h2>9/12 宿泊候補</h2><div class="hotel-note">条件：7名 / 2室以上（または2ベッドルーム以上の貸切）/ 1人1万円以内 / 総額7万円以内 / 9/13朝の建仁寺への移動も考慮</div></div>
 <div class="criteria"><b>今回の判定：</b>「京乃宿 清水五条 呉竹荘」を最有力。9/12に7,000円/人・残2室の表示があり、公式客室には2〜4名定員の和洋室があります。7名を2室に割り当てられるかは予約画面で最終確認してください。</div>
 <div class="hotel-strip" id="hotelStrip"></div>`;
 app.appendChild(wrap);
 const strip=wrap.querySelector('#hotelStrip');
 HOTELS.forEach((h,i)=>{
  const c=document.createElement('article');c.className='hotel-card';
  c.innerHTML=`<div class="hotel-photo">${h.icon}<small>宿イメージ</small></div><div class="hotel-body"><div class="hotel-name">${h.name}</div><div class="hotel-price">${h.price}</div><div class="hotel-sub">${h.area}<br>${h.kenninji}</div><div class="hotel-status"><span class="chip ${i===0?'ok':'warn'}">${h.status}</span><span class="chip">${h.confidence}</span></div></div>`;
  c.onclick=()=>openHotel(h);strip.appendChild(c);
 });
}
function openHotel(h){
 document.getElementById('modalName').textContent=h.name;
 const rows=[['場所',h.area],['料金',h.price],['部屋構成',h.rooms],['9/12空室根拠',h.availability],['建仁寺まで',h.kenninji],['アメニティ',h.amenities],['予算判定',h.budget],['確度',h.confidence]];
 document.getElementById('modalGrid').innerHTML=rows.map(r=>`<div class="modal-label">${r[0]}</div><div>${r[1]}</div>`).join('');
 document.getElementById('modalActions').innerHTML=`<a href="${h.book}" target="_blank">空室・予約 ↗</a><a class="secondary" href="${h.official}" target="_blank">公式/施設 ↗</a><a class="secondary" href="${h.map}" target="_blank">地図 ↗</a>`;
 document.getElementById('hotelModal').classList.add('show');
}
function rows(){
 let r=[];for(const d of DAYS)for(const v of d.events)if(chosen.has(v[0]))r.push({day:d.label.slice(0,4),date:d.date,s:v[1],e:v[2],title:v[3],zone:v[6]});
 return r.sort((a,b)=>a.date.localeCompare(b.date)||M(a.s)-M(b.s))
}
function refresh(){
 const r=rows(),box=document.getElementById('selected');box.innerHTML=r.length?r.map(x=>`<div class="selected-item"><b>${x.day} ${x.s}–${x.e}</b><span>${x.title}</span></div>`).join(''):'<div>まだ予定が選択されていません。</div>';
 document.getElementById('summary').textContent=r.length?r.map(x=>`${x.day} ${x.s} ${x.title}`).join(' / '):'予定未選択';
 const probs=[];
 for(let i=1;i<r.length;i++){if(r[i].date!==r[i-1].date)continue;const gap=M(r[i].s)-M(r[i-1].e),need=transfer(r[i-1].zone,r[i].zone);if(gap<need)probs.push(`${r[i-1].title} → ${r[i].title}: 空き${gap}分に対して移動目安${need}分`)}
 document.getElementById('travelCheck').innerHTML=probs.length?`<div class="travel-warn"><b>移動時間警告</b><br>${probs.join('<br>')}</div>`:`<div class="travel-ok"><b>移動時間チェック</b>：選択中の予定は概算バッファ内です。</div>`;
}
document.getElementById('modalClose').onclick=()=>document.getElementById('hotelModal').classList.remove('show');
document.getElementById('hotelModal').onclick=e=>{if(e.target.id==='hotelModal')e.currentTarget.classList.remove('show')};
document.getElementById('copy').onclick=async()=>{const t=rows().map(x=>`${x.day} ${x.s}–${x.e} ${x.title}`).join('\n');try{await navigator.clipboard.writeText(t);alert('旅程をコピーしました')}catch(e){prompt('コピーしてください',t)}};
render();
</script>
</body>
</html>
